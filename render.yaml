services:
  - type: web
    name: meghbyte-website
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Meghbyte
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://meghbyte-website.onrender.com
      - key: APP_SECRET
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: meghbyte-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: LOG_CHANNEL
        value: stderr
      - key: ADMIN_EMAIL
        value: admin@meghbyte.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "8801890827598"

databases:
  - name: meghbyte-db
    plan: free
    region: singapore
    databaseName: meghbyte
    user: meghbyte
