<VirtualHost *:10000>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Long cache for static assets (filenames carry ?v= version strings).
    <LocationMatch "\.(css|js|svg|png|jpg|webp|woff2)$">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    ServerSignature Off
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

ServerTokens Prod
